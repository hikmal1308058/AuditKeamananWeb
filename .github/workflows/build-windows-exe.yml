name: Build Windows .exe

# Jalan otomatis setiap kali ada push ke repo ini, dan bisa dipicu manual lewat
# tab "Actions" -> pilih workflow ini -> "Run workflow".
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest  # runner Windows gratis dari GitHub -- inilah yang menghasilkan .exe asli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pasang PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Jalankan test dulu (pastikan tidak ada yang rusak)
        run: python -m unittest discover -s tests -t .

      - name: Build AuditKeamananWeb.exe
        run: pyinstaller --onefile --windowed --name AuditKeamananWeb gui_desktop.py

      - name: Unggah .exe sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuditKeamananWeb-exe
          path: dist/AuditKeamananWeb.exe
